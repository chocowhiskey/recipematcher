spring:
  application:
    name: recipe-matcher

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/recipedb
    username: recipeuser
    password: recipepass
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate  # Wichtig! validate = Flyway managed schema
    show-sql: true        # SQL-Statements in Console (nur Dev)
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Thymeleaf (Dev Settings)
  thymeleaf:
    cache: false          # Kein Template-Caching während Entwicklung

# Logging
logging:
  level:
    com.simohoff.recipematcher: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # Zeigt SQL-Parameter